<div class="video-call-container">
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
    <div *ngIf="errorMessage.includes('Camera and microphone access denied')">
      <p>Please allow camera and microphone access in your browser settings and click Retry.</p>
      <button (click)="checkMediaPermissions()">Retry</button>
    </div>
    <div *ngIf="errorMessage.includes('secure context')">
      <p>Please access this application over HTTPS or use localhost for development.</p>
    </div>
  </div>
  <div id="call-container"></div>
</div>
