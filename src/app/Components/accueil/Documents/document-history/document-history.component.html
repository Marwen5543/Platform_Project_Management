<div class="container">
    <h2>My Document Requests</h2>
    
    <table mat-table [dataSource]="documents" class="mat-elevation-z8">
      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Document Type </th>
        <td mat-cell *matCellDef="let doc"> {{ getTypeDisplay(doc.documentType) }} </td>
      </ng-container>
  
      <!-- Period Column -->
      <ng-container matColumnDef="period">
        <th mat-header-cell *matHeaderCellDef> Period </th>
        <td mat-cell *matCellDef="let doc"> 
          {{ doc.monthYear || 'N/A' }} 
        </td>
      </ng-container>
  
      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let doc"> 
          <span [class]="'status-' + doc.status.toLowerCase()">
            {{ getStatusDisplay(doc.status) }}
          </span>
        </td>
      </ng-container>
  
      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Request Date </th>
        <td mat-cell *matCellDef="let doc"> 
          {{ doc.createdAt | date:'medium' }} 
        </td>
      </ng-container>
  
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let doc"> 
          <button mat-raised-button color="primary" 
                  *ngIf="doc.status === 'APPROVED' || doc.status === 'GENERATED'"
                  (click)="downloadDocument(doc.id, doc.documentType, doc.monthYear)">
            Download
          </button>
          <span *ngIf="doc.status === 'PENDING_APPROVAL'" class="pending-text">
            <mat-icon>schedule</mat-icon> Waiting for HR approval
          </span>
          <span *ngIf="doc.status === 'FAILED'" class="failed-text">
            <mat-icon>error</mat-icon> Generation failed - contact HR
          </span>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
