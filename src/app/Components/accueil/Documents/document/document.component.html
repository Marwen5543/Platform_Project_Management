<div class="document-history-container">
    <h2>My Document Requests</h2>
    
    <mat-spinner *ngIf="isLoading" diameter="40"></mat-spinner>
  
    <table mat-table [dataSource]="documents" *ngIf="!isLoading">
      <!-- Document Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Document Type </th>
        <td mat-cell *matCellDef="let doc"> 
          {{ doc.documentType | titlecase }} 
        </td>
      </ng-container>
  
      <!-- Period Column -->
      <ng-container matColumnDef="period">
        <th mat-header-cell *matHeaderCellDef> Period </th>
        <td mat-cell *matCellDef="let doc"> 
          {{ doc.monthYear || 'N/A' }} 
        </td>
      </ng-container>
  
      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let doc"> 
          <span [class]="'status-' + doc.status.toLowerCase()">
            {{ doc.status | titlecase }}
          </span>
        </td>
      </ng-container>
  
      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Request Date </th>
        <td mat-cell *matCellDef="let doc"> 
          {{ doc.createdAt | date:'medium' }} 
        </td>
      </ng-container>
  
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let doc"> 
          <button mat-raised-button color="primary" 
                  *ngIf="doc.status === 'APPROVED'"
                  (click)="downloadDocument(doc)">
            Download
          </button>
          <span *ngIf="doc.status === 'PENDING'" class="pending-text">
            Waiting for approval
          </span>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="['type', 'period', 'status', 'date', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['type', 'period', 'status', 'date', 'actions'];"></tr>
    </table>
  </div>
