<header class="header">
  <div class="mobile-menu-toggle" (click)="sidebarService.toggle()">
    <i class="fas fa-bars"></i>
  </div>
  <div class="header-content">
    <h1>Project Management Suite</h1>
  </div>
  <div class="header-actions">
    <div class="profile-dropdown">
      <button class="dropdown-toggle" (click)="toggleProfileDropdown()">
        <i class="fas fa-user-circle"></i> {{ user.username }}
        <i class="fas fa-chevron-down"></i>
      </button>
      <div class="dropdown-menu" *ngIf="profileDropdownOpen">
        <div class="dropdown-item" (click)="navigateToProfile()">Mon Profil</div> 
        <div class="dropdown-item" (click)="logout()">Déconnexion</div>
      </div>
    </div>
  </div>
</header>
