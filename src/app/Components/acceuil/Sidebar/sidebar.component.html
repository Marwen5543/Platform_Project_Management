<aside class="sidebar" [ngClass]="{'collapsed': (sidebarService.collapsed$ | async)}">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <img src="assets/tunisys.png" alt="Tunisys" class="sidebar-logo-img">
    </div>
    <div class="sidebar-toggle" (click)="sidebarService.toggle()">
      <i class="fas" [ngClass]="(sidebarService.collapsed$ | async) ? 'fa-angle-right' : 'fa-angle-left'"></i>
    </div>
  </div>
      <!-- Admin Section - Only for SUPER_ADMIN -->
  <ng-container *ngIf="isSuperAdmin">
    <div class="dropdown-header" (click)="sidebarService.toggleAdmin()">
      <i class="fas fa-user-shield"></i>
      <span *ngIf="!(sidebarService.collapsed$ | async)">Admin</span>
      <i class="fas fa-chevron-down dropdown-icon" 
         [ngClass]="{'rotate': (sidebarService.showAdmin$ | async)}"></i>
    </div>
    <div class="dropdown-content" *ngIf="sidebarService.showAdmin$ | async" [@slideDown]>
      <div class="dropdown-item" 
           (click)="navigateAndSelect('manage-users', '/admin/manage-users')">
        <i class="fas fa-users-cog"></i>
        <span>Manage Users</span>
      </div>
      <div class="dropdown-item" 
           (click)="navigateAndSelect('system-settings', '/admin/system-settings')">
        <i class="fas fa-cogs"></i>
        <span>System Settings</span>
      </div>
    </div>
  </ng-container>
  <!-- Navigation Items -->
  <div class="sidebar-item" 
  (click)="navigateAndSelect('acceuil', '/acceuil')" 
  [ngClass]="{'active': (sidebarService.selectedSection$ | async) === 'acceuil'}">
    <i class="fas fa-home"></i>
    <span *ngIf="!(sidebarService.collapsed$ | async)">Accueil</span>
  </div>

  <div class="sidebar-item" 
       (click)="navigateAndSelect('profile', '/profile')" 
       [ngClass]="{'active': (sidebarService.selectedSection$ | async) === 'profile'}">
    <i class="fas fa-user-circle"></i>
    <span *ngIf="!(sidebarService.collapsed$ | async)">Profil</span>
  </div>

  <div class="sidebar-item" 
       (click)="navigateAndSelect('ajouter-employee', '/ajouter-employee')" 
       [ngClass]="{'active': (sidebarService.selectedSection$ | async) === 'ajouter-employee'}">
    <i class="fas fa-user-plus"></i>
    <span *ngIf="!(sidebarService.collapsed$ | async)">Ajouter Employé</span>
  </div>
    
  <!-- Dropdown for Gestion Congé -->
  <div class="dropdown-header" (click)="sidebarService.toggleGestionConge()">
    <i class="fas fa-calendar-alt"></i>
    <span *ngIf="!(sidebarService.collapsed$ | async)">Gestion Congé</span>
    <i class="fas fa-chevron-down dropdown-icon" 
       [ngClass]="{'rotate': (sidebarService.showGestionConge$ | async)}"></i>
  </div>
  <div class="dropdown-content" *ngIf="sidebarService.showGestionConge$ | async" [@slideDown]>
    <div class="dropdown-item" (click)="navigateAndSelect('demande-conge', '/demande-conge')">
      <i class="fas fa-file-import"></i>
      <span>Demande Congé</span>
    </div>
    <div class="dropdown-item" (click)="navigateAndSelect('consulter-conge', '/consulter-conge')">
      <i class="fas fa-search"></i>
      <span>Consulter Congé</span>
    </div>
    <div class="dropdown-item" (click)="navigateAndSelect('liste-equipe-conge', '/liste-equipe-conge')">
      <i class="fas fa-users"></i>
      <span>Liste Équipe</span>
    </div>
  </div>
    
  <!-- Dropdown for Documents -->
  <div class="dropdown-header" (click)="sidebarService.toggleDocuments()">
    <i class="fas fa-folder-open"></i>
    <span *ngIf="!(sidebarService.collapsed$ | async)">Documents</span>
    <i class="fas fa-chevron-down dropdown-icon" 
       [ngClass]="{'rotate': (sidebarService.showDocuments$ | async)}"></i>
  </div>
  <div class="dropdown-content" *ngIf="sidebarService.showDocuments$ | async" [@slideDown]>
    <div class="dropdown-item" (click)="navigateAndSelect('fiche-paie', '/fiche-paie')">
      <i class="fas fa-money-check"></i>
      <span>Fiche de Paie</span>
    </div>
    <div class="dropdown-item" (click)="navigateAndSelect('attestation-travail', '/attestation-travail')">
      <i class="fas fa-file-contract"></i>
      <span>Attestation de Travail</span>
    </div>
    <div class="dropdown-item" (click)="navigateAndSelect('certificat-travail', '/certificat-travail')">
      <i class="fas fa-award"></i>
      <span>Certificat de Travail</span>
    </div>
  </div>
    
  <div class="sidebar-item" 
       (click)="navigateAndSelect('plannification', '/plannification')" 
       [ngClass]="{'active': (sidebarService.selectedSection$ | async) === 'plannification'}">
    <i class="fas fa-calendar-check"></i>
    <span *ngIf="!(sidebarService.collapsed$ | async)">Plannification</span>
  </div>
</aside>
