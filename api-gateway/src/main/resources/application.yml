server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalfilters:
        - name: RequestHeaderToRequestUri
          args:
            name: X-Forwarded-Uri
      routes:
        - id: user-service-route
          uri: lb://user-management-service
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

        - id: leave-management-service
          uri: lb://leave-management-service
          predicates:
            - Path=/api/leaves/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Service-Name,leave-management

        - id: document-management-service
          uri: lb://document-management-service
          predicates:
            - Path=/api/documents/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Service-Name,document-management

        - id: actuator-route
          uri: lb://${spring.application.name}
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=1

      default-filters:
        - AddResponseHeader=X-Gateway-Version,1.0.0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/demo}

  eureka:
    instance:
      prefer-ip-address: false
      hostname: localhost
      instance-id: ${spring.application.name}:localhost:${server.port}
      statusPageUrl: http://localhost:${server.port}/actuator/info
      healthCheckUrl: http://localhost:${server.port}/actuator/health
      homePageUrl: http://localhost:${server.port}/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.netflix.eureka: DEBUG
    reactor.netty: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true   # makes environment info available

info:
  app:
    name: ${spring.application.name}
    description: API Gateway for microservices
    version: 1.0.0
