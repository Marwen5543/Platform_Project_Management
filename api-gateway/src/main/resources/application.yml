spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-management-service
          uri: lb://user-management-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2  # Changed to strip /api/users to match service endpoint
            - AddRequestHeader=X-Service-Name,user-management
        - id: leave-management-service
          uri: lb://leave-management-service
          predicates:
            - Path=/api/leaves/**
          filters:
            - StripPrefix=2  # Changed to strip /api/leaves to match service endpoint
            - AddRequestHeader=X-Service-Name,leave-management
        - id: document-management-service
          uri: lb://document-management-service
          predicates:
            - Path=/api/documents/**
          filters:
            - StripPrefix=2  # Changed to strip /api/documents to match service endpoint
            - AddRequestHeader=X-Service-Name,document-management
        # Added route for Actuator endpoints to allow direct access
        - id: actuator-route
          uri: lb://${spring.application.name}
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=1
      default-filters:
        - AddResponseHeader=X-Gateway-Version,1.0.0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/Tunisys
          jwk-set-uri: http://localhost:8080/realms/Tunisys/protocol/openid-connect/certs
server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost
    status-page-url: http://localhost:${server.port}/actuator/info
    health-check-url: http://localhost:${server.port}/actuator/health
    home-page-url: http://localhost:${server.port}/
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
      base-path: /actuator
      cors:
        allowed-origins: http://localhost:3000,http://localhost:4200  # Restricted for security
        allowed-methods: GET,POST
        allowed-headers: "*"
        allow-credentials: true
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    description: API Gateway Service
    version: 1.0.0
resilience4j:
  circuitbreaker:
    instances:
      user-management-service:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 10000
      leave-management-service:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 10000
      document-management-service:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 10000
logging:
  level:
    org.springframework.cloud.gateway: INFO  # Reduced from DEBUG for production
    org.springframework.security: INFO      # Reduced from DEBUG for production
    org.springframework.web: INFO           # Reduced from DEBUG for production
    reactor.netty: INFO                     # Reduced from DEBUG for production