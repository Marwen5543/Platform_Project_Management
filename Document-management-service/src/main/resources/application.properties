# Basic Service Configuration
spring.application.name=document-management-service
server.port=8090

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/management_Database
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Keycloak Configuration
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=${KEYCLOAK_REALM:Tunisys}
keycloak.resource=${KEYCLOAK_RESOURCE:demo-rest-api}
keycloak.credentials.secret=${KEYCLOAK_CREDENTIALS_SECRET:g2XhOH0r047lVql0LLTGUmz8I6qUHNDp}


# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.hostname=localhost
eureka.instance.status-page-url=http://localhost:${server.port}/actuator/info
eureka.instance.health-check-url=http://localhost:${server.port}/actuator/health
eureka.instance.home-page-url=http://localhost:${server.port}/

# Actuator Configuration
#management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST
management.endpoint.health.show-details=always
management.info.env.enabled=true
# Expose the health and prometheus actuator endpoints over web
management.endpoints.web.exposure.include=health,prometheus,info,metrics

# Add application name and instance ID to metrics for better filtering in Prometheus
management.metrics.tags.application=${spring.application.name}
# Info Endpoint Configuration
info.app.name=${spring.application.name}
info.app.description=Document Management Service
info.app.version=1.0.0

# Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.example.documentmanagementservice=DEBUG
logging.level.feign=DEBUG

document.storage.path=/app/documents
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5



