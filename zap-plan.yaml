---
env:
  contexts:
    - name: "Default Context"
      urls:
        - "${ZAP_TARGET_URL}"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: "spider"
    parameters:
      url: "${ZAP_TARGET_URL}"
      maxDuration: 2
      
  - type: "passiveScan-wait"
    parameters:
      maxDuration: 5
      
  - type: "activeScan"
    parameters:
      context: "Default Context"
      maxDuration: 5
      
  - type: "report"
    parameters:
      template: "traditional-html"
      reportDir: "wrk"
      reportFile: "report"
      
  - type: "report"
    parameters:
      template: "traditional-json"
      reportDir: "wrk"
      reportFile: "gl-dast-report"