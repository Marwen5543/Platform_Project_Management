# ===================================================================
# .gitlab-ci.yml - CORRECTED VERSION WITH PROPER ARTIFACT CHAIN
# ===================================================================
default:
  tags:
    - docker
    
stages:
  - build-and-test
  - code-analysis
  - push

# Reusable template for SonarQube analysis
.sonar_scanner_template:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Running SonarQube analysis for $MICROSERVICE_NAME..."
    - cd $MICROSERVICE_PATH
    # The 'verify' phase runs tests, and 'sonar:sonar' sends the results
    - >-
      mvn verify sonar:sonar
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  # IMPORTANT: Pass through the artifacts from the build stage
  artifacts:
    paths:
      - $MICROSERVICE_PATH/target/
    expire_in: 1 hour
  allow_failure: false

# Reusable template for pushing to Docker Hub
.build_and_push_template:
  stage: push
  image: docker:20.10.16
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - echo "Testing Docker connection..."
    - docker version
    - docker info
    - echo "=== DEBUGGING ARTIFACTS ==="
    - echo "Current working directory:"
    - pwd
    - echo "Contents of current directory:"
    - ls -la
    - echo "Contents of microservice directory:"
    - ls -la $MICROSERVICE_PATH/ || echo "Microservice directory not found"
    - echo "Looking for target directory:"
    - ls -la $MICROSERVICE_PATH/target/ || echo "Target directory not found"
    - echo "Searching for JAR files:"
    - find . -name "*.jar" -type f || echo "No JAR files found"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker image..."
    - echo "Changing to microservice directory: $MICROSERVICE_PATH"
    - cd $MICROSERVICE_PATH
    - echo "Final check - current directory contents:"
    - ls -la
    - echo "Final check - target directory contents:"
    - ls -la target/
    - echo "Building Docker image from microservice directory..."
    - docker build -t "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA" .
    - echo "Pushing Docker image..."
    - docker push "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA"

# ===================================================================
# JOBS FOR: user-management-service
# ===================================================================
unit-tests:user-service:
  stage: build-and-test
  image: maven:3.8.5-openjdk-17
  script:
    - cd user-management-service
    - mvn clean package
  artifacts:
    paths:
      - user-management-service/target/
    reports:
      junit:
        - user-management-service/target/surefire-reports/TEST-*.xml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

sonar-analysis:user-service:
  extends: .sonar_scanner_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
    SONAR_PROJECT_KEY: com.tunisys:user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push:user-service:
  extends: .build_and_push_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
    # NOTE: Changed from sonar-analysis to unit-tests to get the JAR artifacts
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

