# ===================================================================
# FINAL CORRECTED VERSION
# ===================================================================
default:
  tags:
    - docker
    
stages:
  - build-and-test
  - code-analysis
  - push

# Reusable template for SonarQube analysis
.sonar_scanner_template:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Running SonarQube analysis for $MICROSERVICE_NAME..."
    - cd $MICROSERVICE_PATH
    - >-
      mvn verify sonar:sonar
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  artifacts:
    paths:
      - $MICROSERVICE_PATH/target/
    expire_in: 1 hour
  allow_failure: false

# Reusable template for pushing to Docker Hub
.build_and_push_template:
  stage: push
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    # Wait for Docker daemon to start
    - sleep 10
    # Check Docker daemon status with proper timeout and interval
    - timeout=60
    - interval=5
    - elapsed=0
    - |
      while ! docker info >/dev/null 2>&1; do
        if [ $elapsed -ge $timeout ]; then
          echo "Docker daemon failed to start within $timeout seconds"
          exit 1
        fi
        echo "Waiting for Docker daemon... ($elapsed/$timeout seconds)"
        sleep $interval
        elapsed=$((elapsed + interval))
      done
    - echo "Docker daemon is ready"
    # Verify Docker is working
    - docker version
    # Log in to Docker Hub
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker image for $MICROSERVICE_NAME..."
    - cd $MICROSERVICE_PATH
    - docker build -t "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:latest"
    - docker push "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:latest"
  after_script:
    - docker logout

# ===================================================================
# JOBS FOR: user-management-service
# ===================================================================
unit-tests:user-service:
  stage: build-and-test
  image: maven:3.8.5-openjdk-17
  script:
    - cd user-management-service
    - mvn clean package
  artifacts:
    paths:
      - user-management-service/target/
    reports:
      junit:
        - user-management-service/target/surefire-reports/TEST-*.xml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

sonar-analysis:user-service:
  extends: .sonar_scanner_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
    SONAR_PROJECT_KEY: com.tunisys:user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push:user-service:
  extends: .build_and_push_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

