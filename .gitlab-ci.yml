# ===================================================================
# FINAL, FULLY CORRECTED AND CONSISTENT VERSION
# ===================================================================
default:
  tags:
    - docker
    
stages:
  - build-and-deploy-to-nexus
  - code-analysis
  - push-to-dockerhub

# ===================================================================
# REUSABLE TEMPLATES
# ===================================================================

.build_and_deploy_template:
  stage: build-and-deploy-to-nexus
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Building, testing, and deploying $MICROSERVICE_NAME to Nexus..."
    - cd $MICROSERVICE_PATH
    - mvn clean deploy -s $SETTINGS_XML
  artifacts:
    paths:
      - $MICROSERVICE_PATH/target/
    reports:
      junit:
        - $MICROSERVICE_PATH/target/surefire-reports/TEST-*.xml
    expire_in: 1 hour

.sonar_scanner_template:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Running SonarQube analysis for $MICROSERVICE_NAME..."
    - cd $MICROSERVICE_PATH
    - mvn verify sonar:sonar -s $SETTINGS_XML
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  allow_failure: false # The job will fail if the SonarQube Quality Gate fails

.build_and_push_kaniko:
  # FIX: The stage name for this template was wrong. It should be push-to-dockerhub.
  stage: push-to-dockerhub 
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "Building Docker image for $MICROSERVICE_NAME..."
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n ${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $CI_PROJECT_DIR/$MICROSERVICE_PATH
      --dockerfile $CI_PROJECT_DIR/$MICROSERVICE_PATH/Dockerfile
      --destination $DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA
      --destination $DOCKERHUB_USERNAME/$MICROSERVICE_NAME:latest

# ===================================================================
# JOBS FOR: user-management-service (NOW USING TEMPLATES)
# ===================================================================
build-and-deploy:user-service:
  # FIX: Use the reusable template to ensure consistency.
  extends: .build_and_deploy_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

sonar-analysis:user-service:
  extends: .sonar_scanner_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
    SONAR_PROJECT_KEY: com.tunisys:user-management-service
  needs:
    # FIX: Point to the new, correct job name for the 'needs' dependency.
    - job: build-and-deploy:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

push:user-service:
  extends: .build_and_push_kaniko
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  needs:
    # FIX: Also point to the correct job name here.
    - job: build-and-deploy:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

