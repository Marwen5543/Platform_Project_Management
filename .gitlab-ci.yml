# ===================================================================
# FINAL VERSION - USING DOCKER-IN-DOCKER
# ===================================================================
default:
  tags:
    - docker

stages:
  - setup
  - build-and-push-to-nexus
  - code-analysis
  - performance-test
  - push-and-scan-image

# ===================================================================
# GLOBAL VARIABLES AND TEMPLATES
# ===================================================================
variables:
  # Define a stable docker version to use
  DOCKER_VERSION: "20.10.16"
  # Set the driver for Docker-in-Docker
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # Disable TLS for dind service

# update-trivy-db job remains the same and is correct.
update-trivy-db:
  stage: setup
  image: alpine:3.18
  cache:
    key: trivy-global-cache-v2
    paths:
      - .trivycache/
    policy: pull-push
  script:
    - apk add --no-cache wget ca-certificates
    - wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - trivy image --download-db-only --cache-dir "$CI_PROJECT_DIR/.trivycache/" --timeout 30m
    - trivy image --download-java-db-only --cache-dir "$CI_PROJECT_DIR/.trivycache/" --timeout 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ===================================================================
# NEW UNIFIED DOCKER + TRIVY TEMPLATE (THE FINAL FIX)
# ===================================================================
.docker_build_and_scan_template: &docker_build_and_scan_template
  stage: push-and-scan-image
  image: docker:${DOCKER_VERSION}
  services:
    - docker:${DOCKER_VERSION}-dind
  cache:
    key: trivy-global-cache-v2
    paths:
      - .trivycache/
    policy: pull
  before_script:
    - echo "Waiting for Docker daemon to be ready..."
    - while ! docker info; do sleep 1; done
    - echo "Installing dependencies: curl, ca-certificates, and trivy..."
    - apk update
    - apk add --no-cache curl ca-certificates
    - curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.58.0/trivy_0.58.0_Linux-64bit.tar.gz -o trivy.tar.gz
    - tar -xzf trivy.tar.gz
    - mv trivy /usr/local/bin/
    - trivy --version
    - echo "Logging in to Docker Hub..."
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker image..."
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_NAME:latest" "$BUILD_CONTEXT"
    - echo "Scanning the final container image for vulnerabilities..."
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --cache-dir "$CI_PROJECT_DIR/.trivycache/" --skip-db-update --skip-java-db-update --format template --template "@contrib/gitlab.tpl" -o gl-container-scanning-report.json "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - echo "Trivy scan passed. Pushing images to registry..."
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:latest"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 1 week

# ===================================================================
# JOBS FOR ALL SERVICES
# The build, sonar, and performance jobs are unchanged.
# Only the push-and-scan jobs are updated to use the new template.
# ===================================================================

# --- USER-MANAGEMENT-SERVICE ---
build-and-push:user-service:
  stage: build-and-push-to-nexus
  image: maven:3.8.5-openjdk-17
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - mvn clean deploy -s ../settings-temp.xml
  artifacts:
    paths:
      - user-management-service/target/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*
# Sonar and Performance jobs for user-service are fine, no change needed.
sonar-analysis:user-service:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - >-
      mvn verify sonar:sonar -s ../settings-temp.xml
      -Dsonar.projectKey=com.tunisys:user-management-service
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  needs:
    - job: build-and-push:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*
performance-test:user-service:
  stage: performance-test
  image: maven:3.8.5-openjdk-17
  needs: ["build-and-push:user-service"]
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - >-
      mvn gatling:test -s ../settings-temp.xml
      -Dgatling.simulationClass=company.user_management_service.simulations.UserManagementSimulation
      -DAPP_URL=${STAGING_APP_URL}
  artifacts:
    when: always
    paths:
      - user-management-service/target/gatling/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push-and-scan:user-service:
  <<: *docker_build_and_scan_template
  variables:
    IMAGE_NAME: "$DOCKERHUB_USERNAME/user-management-service"
    BUILD_CONTEXT: "user-management-service"
  needs:
    - job: build-and-push:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

