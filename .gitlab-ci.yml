# ===================================================================
# FINAL, SIMPLE VERSION BASED ON YOUR WORKING FILE
# ===================================================================
default:
  tags:
    - docker
    
stages:
  - build-and-test
  - code-analysis
  - push

# ===================================================================
# JOBS FOR: user-management-service
# ===================================================================
unit-tests:user-service:
  stage: build-and-test
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Preparing settings.xml for deployment..."
    # This is the robust fix: copy the settings file and use 'sed' to replace placeholders.
    - cp $SETTINGS_XML ./settings-temp.xml
    - sed -i "s|NEXUS_URL_PLACEHOLDER|$NEXUS_URL|g" ./settings-temp.xml
    - sed -i "s|NEXUS_USERNAME_PLACEHOLDER|$NEXUS_USERNAME|g" ./settings-temp.xml
    - sed -i "s|NEXUS_PASSWORD_PLACEHOLDER|$NEXUS_PASSWORD|g" ./settings-temp.xml
    
    - echo "Building, testing, and deploying user-management-service to Nexus..."
    - cd user-management-service
    # Use the temporary settings file we just created
    - mvn clean deploy -s ../settings-temp.xml
  artifacts:
    paths:
      - user-management-service/target/
    reports:
      junit:
        - user-management-service/target/surefire-reports/TEST-*.xml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

# --- NO CHANGES TO SONAR OR PUSH JOBS (except needs) ---
sonar-analysis:user-service:
  # ... (this job remains exactly as you had it)
  extends: .sonar_scanner_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
    SONAR_PROJECT_KEY: com.tunisys:user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push:user-service:
  # ... (this job remains exactly as you had it)
  extends: .build_and_push_kaniko
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

