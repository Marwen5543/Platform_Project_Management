# This pipeline has a dedicated 'test' stage for the user-service.
# This version is corrected to handle job dependencies and rules properly.

stages:
  - build-and-test
  - push

# Reusable template for pushing to Docker Hub
.build_and_push_template:
  stage: push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker image for $MICROSERVICE_NAME..."
    - docker build -t "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA" -f "$MICROSERVICE_PATH/Dockerfile" .
    - echo "Pushing new image version to Docker Hub..."
    - docker push "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA"

# ===================================================================
# JOBS FOR: user-management-service
# ===================================================================
unit-tests:user-service:
  stage: build-and-test
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Building and testing user-management-service..."
    - cd user-management-service
    - mvn clean package
  artifacts:
    paths:
      - user-management-service/target/*.jar
    reports:
      junit:
        - user-management-service/target/surefire-reports/TEST-*.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push:user-service:
  extends: .build_and_push_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

