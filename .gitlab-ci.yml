# ===================================================================
# FINAL, PROFESSIONAL, AND FAST VERSION
# ===================================================================
default:
  tags:
    - docker

stages:
  - setup
  - build-and-push-to-nexus
  - code-analysis
  - performance-test
  - push-and-scan-image

variables:
  DOCKER_VERSION: "20.10.16"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # Define the cache directory as a variable
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"

# ===================================================================
# CHANGE 1: THE NEW SCHEDULED JOB FOR UPDATING THE CACHE
# This job runs slowly on a schedule to pre-warm the cache.
# ===================================================================
update-trivy-db:
  stage: setup
  image: alpine:3.18
  cache:
    key: trivy-db-v3 # Use a consistent key
    paths:
      - .trivycache/
    policy: pull-push # This job UPDATES the cache
  script:
    - echo "Updating Trivy database cache..."
    - apk add --no-cache wget ca-certificates
    - wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - mkdir -p $TRIVY_CACHE_DIR
    # This is allowed to be slow. We give it a long timeout.
    - echo "Downloading OS vulnerability database..."
    - trivy image --download-db-only --cache-dir $TRIVY_CACHE_DIR --timeout 30m
    - echo "Downloading Java index database (this can take a long time)..."
    - trivy image --download-java-db-only --cache-dir $TRIVY_CACHE_DIR --timeout 45m
    - echo "Trivy cache updated successfully."
  rules:
    # This job ONLY runs when you trigger it on a schedule.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ===================================================================
# CHANGE 2: THE UPDATED TEMPLATE FOR THE MAIN PIPELINE
# This template is now configured to NEVER download the DB.
# ===================================================================
.docker_build_and_scan_template: &docker_build_and_scan_template
  stage: push-and-scan-image
  image: docker:${DOCKER_VERSION}
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  cache:
    key: trivy-db-v3 # Use the same key
    paths:
      - .trivycache/
    policy: pull # This job ONLY READS the cache
  before_script:
    # ... (the before_script is mostly the same)
    - while ! docker info; do sleep 1; done
    - apk update && apk add --no-cache curl ca-certificates
    - curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.58.0/trivy_0.58.0_Linux-64bit.tar.gz | tar -C /usr/local/bin -xzf - trivy
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_NAME:latest" "$BUILD_CONTEXT"
    - echo "Scanning the container image using pre-warmed cache..."
    # THESE FLAGS ARE THE KEY TO MAKING IT FAST
    - >
      trivy image --exit-code 1 --severity CRITICAL,HIGH
      --cache-dir $TRIVY_CACHE_DIR
      --skip-db-update
      --skip-java-db-update
      --format template --template "@contrib/gitlab.tpl"
      -o gl-container-scanning-report.json "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - echo "Trivy scan passed. Pushing images..."
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:latest"
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json

# --- PASTE ALL YOUR OTHER JOBS BELOW. They do not need to change. ---
# (build-and-push:user-service, sonar-analysis:user-service, push-and-scan:user-service, etc.)
# The push-and-scan jobs will automatically use the new, fast template.
# ===================================================================

# --- USER-MANAGEMENT-SERVICE ---
build-and-push:user-service:
  stage: build-and-push-to-nexus
  image: maven:3.8.5-openjdk-17
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - mvn clean deploy -s ../settings-temp.xml
  artifacts:
    paths:
      - user-management-service/target/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*
# Sonar and Performance jobs for user-service are fine, no change needed.
sonar-analysis:user-service:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - >-
      mvn verify sonar:sonar -s ../settings-temp.xml
      -Dsonar.projectKey=com.tunisys:user-management-service
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  needs:
    - job: build-and-push:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*
performance-test:user-service:
  stage: performance-test
  image: maven:3.8.5-openjdk-17
  needs: ["build-and-push:user-service"]
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - >-
      mvn gatling:test -s ../settings-temp.xml
      -Dgatling.simulationClass=company.user_management_service.simulations.UserManagementSimulation
      -DAPP_URL=${STAGING_APP_URL}
  artifacts:
    when: always
    paths:
      - user-management-service/target/gatling/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push-and-scan:user-service:
  <<: *docker_build_and_scan_template
  variables:
    IMAGE_NAME: "$DOCKERHUB_USERNAME/user-management-service"
    BUILD_CONTEXT: "user-management-service"
  needs:
    - job: build-and-push:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

