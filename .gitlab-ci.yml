# ===================================================================
# IMPROVED GITLAB CI WITH TRIVY SECURITY SCANNING
# ===================================================================
default:
  tags:
    - docker

stages:
  - setup
  - build-and-push-to-nexus
  - code-analysis
  - performance-test
  - push-and-scan-image

variables:
  DOCKER_VERSION: "20.10.16"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  # Add these variables to control Trivy behavior
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_IGNORE_UNFIXED: "true"
  TRIVY_TIMEOUT: "30m"

# ===================================================================
# SCHEDULED JOB FOR UPDATING THE CACHE
# ===================================================================
update-trivy-db:
  stage: setup
  image: alpine:3.18
  cache:
    key: trivy-db-v4
    paths:
      - .trivycache/
    policy: pull-push
  script:
    - echo "Updating Trivy database cache..."
    - apk add --no-cache wget ca-certificates
    - wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - mkdir -p $TRIVY_CACHE_DIR
    - echo "Downloading OS vulnerability database..."
    - trivy image --download-db-only --cache-dir $TRIVY_CACHE_DIR --timeout 30m
    - echo "Downloading Java index database..."
    - trivy image --download-java-db-only --cache-dir $TRIVY_CACHE_DIR --timeout 45m
    - echo "Trivy cache updated successfully."
    - ls -la $TRIVY_CACHE_DIR
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'

# ===================================================================
# IMPROVED DOCKER BUILD AND SCAN TEMPLATE
# ===================================================================
.docker_build_and_scan_template: &docker_build_and_scan_template
  stage: push-and-scan-image
  image: docker:${DOCKER_VERSION}
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  cache:
    key: trivy-db-v4
    paths:
      - .trivycache/
    policy: pull
  before_script:
    - while ! docker info; do sleep 1; done
    - apk update && apk add --no-cache curl ca-certificates jq
    - curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.58.0/trivy_0.58.0_Linux-64bit.tar.gz | tar -C /usr/local/bin -xzf - trivy
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - mkdir -p $TRIVY_CACHE_DIR
  script:
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_NAME:latest" "$BUILD_CONTEXT"
    - echo "Scanning the container image for vulnerabilities..."
    
    # First, run a scan without exit-code to generate the report
    - |
      if [ -d "$TRIVY_CACHE_DIR" ] && [ "$(ls -A $TRIVY_CACHE_DIR)" ]; then
        echo "Using pre-warmed cache..."
        trivy image --severity ${TRIVY_SEVERITY} \
          --cache-dir $TRIVY_CACHE_DIR \
          --skip-db-update \
          --skip-java-db-update \
          --ignore-unfixed=${TRIVY_IGNORE_UNFIXED} \
          --format json \
          --output trivy-report.json \
          "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      else
        echo "Cache not found or empty. Downloading database..."
        trivy image --severity ${TRIVY_SEVERITY} \
          --cache-dir $TRIVY_CACHE_DIR \
          --timeout ${TRIVY_TIMEOUT} \
          --ignore-unfixed=${TRIVY_IGNORE_UNFIXED} \
          --format json \
          --output trivy-report.json \
          "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      fi
    
    # Generate human-readable report
    - trivy image --severity ${TRIVY_SEVERITY} --cache-dir $TRIVY_CACHE_DIR --skip-db-update --skip-java-db-update --ignore-unfixed=${TRIVY_IGNORE_UNFIXED} --format table "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" | tee trivy-report.txt
    
    # Check if there are any HIGH or CRITICAL vulnerabilities
    - |
      VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-report.json || echo "0")
      echo "Found $VULN_COUNT HIGH/CRITICAL vulnerabilities"
      
      if [ "$VULN_COUNT" -gt 0 ]; then
        echo "❌ Security scan failed: Found $VULN_COUNT HIGH/CRITICAL vulnerabilities"
        echo "Please review the trivy-report.json and trivy-report.txt artifacts"
        
        # Option 1: Fail the pipeline (current behavior)
        # exit 1
        
        # Option 2: Allow pipeline to continue but mark as warning
        echo "⚠️  Continuing pipeline despite vulnerabilities (review required)"
        
        # Option 3: Only fail on CRITICAL vulnerabilities
        CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json || echo "0")
        if [ "$CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ Found $CRITICAL_COUNT CRITICAL vulnerabilities - failing pipeline"
          exit 1
        else
          echo "⚠️  Only HIGH vulnerabilities found - continuing pipeline"
        fi
      else
        echo "✅ No HIGH/CRITICAL vulnerabilities found"
      fi
    
    - echo "Pushing images to registry..."
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:latest"
    
  artifacts:
    paths:
      - trivy-report.json
      - trivy-report.txt
    reports:
      # This creates a security report in GitLab
      container_scanning: trivy-report.json
    when: always
    expire_in: 1 week
  # Change this based on your preference
  allow_failure: true  # Set to false if you want to fail the pipeline on vulnerabilities

# ===================================================================
# ALTERNATIVE: SEPARATE SCAN JOB (NON-BLOCKING)
# ===================================================================
.security_scan_template: &security_scan_template
  stage: push-and-scan-image
  image: alpine:3.18
  cache:
    key: trivy-db-v4
    paths:
      - .trivycache/
    policy: pull
  before_script:
    - apk add --no-cache wget ca-certificates jq
    - wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - mkdir -p $TRIVY_CACHE_DIR
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Scanning $IMAGE_NAME:$CI_COMMIT_SHORT_SHA for vulnerabilities..."
    - |
      trivy image --severity ${TRIVY_SEVERITY} \
        --cache-dir $TRIVY_CACHE_DIR \
        --skip-db-update \
        --skip-java-db-update \
        --ignore-unfixed=${TRIVY_IGNORE_UNFIXED} \
        --format json \
        --output trivy-report.json \
        "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    
    - trivy image --severity ${TRIVY_SEVERITY} --cache-dir $TRIVY_CACHE_DIR --skip-db-update --skip-java-db-update --ignore-unfixed=${TRIVY_IGNORE_UNFIXED} --format table "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" | tee trivy-report.txt
    
    - |
      VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-report.json || echo "0")
      echo "Security scan completed. Found $VULN_COUNT HIGH/CRITICAL vulnerabilities"
      
      if [ "$VULN_COUNT" -gt 0 ]; then
        echo "⚠️  Please review the security report in the job artifacts"
      else
        echo "✅ No HIGH/CRITICAL vulnerabilities found"
      fi
  artifacts:
    paths:
      - trivy-report.json
      - trivy-report.txt
    reports:
      container_scanning: trivy-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# --- USER-MANAGEMENT-SERVICE ---
build-and-push:user-service:
  stage: build-and-push-to-nexus
  image: maven:3.8.5-openjdk-17
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - mvn clean deploy -s ../settings-temp.xml
  artifacts:
    paths:
      - user-management-service/target/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

sonar-analysis:user-service:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - >-
      mvn verify sonar:sonar -s ../settings-temp.xml
      -Dsonar.projectKey=com.tunisys:user-management-service
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  needs:
    - job: build-and-push:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

performance-test:user-service:
  stage: performance-test
  image: maven:3.8.5-openjdk-17
  needs: ["build-and-push:user-service"]
  script:
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - >-
      mvn gatling:test -s ../settings-temp.xml
      -Dgatling.simulationClass=company.user_management_service.simulations.UserManagementSimulation
      -DAPP_URL=${STAGING_APP_URL}
  artifacts:
    when: always
    paths:
      - user-management-service/target/gatling/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push-and-scan:user-service:
  <<: *docker_build_and_scan_template
  variables:
    IMAGE_NAME: "$DOCKERHUB_USERNAME/user-management-service"
    BUILD_CONTEXT: "user-management-service"
  needs:
    - job: build-and-push:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

