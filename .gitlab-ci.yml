# ===================================================================
# FINAL CORRECTED VERSION
# ===================================================================
default:
  tags:
    - docker
    
stages:
  - build-and-test
  - code-analysis
  - push

# Reusable template for SonarQube analysis
.sonar_scanner_template:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Running SonarQube analysis for $MICROSERVICE_NAME..."
    - cd $MICROSERVICE_PATH
    - >-
      mvn verify sonar:sonar
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  artifacts:
    paths:
      - $MICROSERVICE_PATH/target/
    expire_in: 1 hour
  allow_failure: false

.build_and_push_kaniko:
  stage: push
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""] # Important: We need a shell, so we override the default entrypoint.
  script:
    - echo "Building with Kaniko (no Docker daemon required)..."
    # Create the Docker config file for Kaniko to authenticate with Docker Hub.
    # This is the secure way to handle credentials for Kaniko.
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n ${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    # Run the Kaniko executor to build and push the image.
    - /kaniko/executor
      --context $CI_PROJECT_DIR/$MICROSERVICE_PATH
      --dockerfile $CI_PROJECT_DIR/$MICROSERVICE_PATH/Dockerfile
      --destination $DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA
      --destination $DOCKERHUB_USERNAME/$MICROSERVICE_NAME:latest

# ===================================================================
# JOBS FOR: user-management-service
# ===================================================================
unit-tests:user-service:
  stage: build-and-test
  image: maven:3.8.5-openjdk-17
  script:
    - cd user-management-service
    - mvn clean package
  artifacts:
    paths:
      - user-management-service/target/
    reports:
      junit:
        - user-management-service/target/surefire-reports/TEST-*.xml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

sonar-analysis:user-service:
  extends: .sonar_scanner_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
    SONAR_PROJECT_KEY: com.tunisys:user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push:user-service:
  extends: .build_and_push_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  needs:
    - job: unit-tests:user-service
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

