# ===================================================================
# FINAL, COMPLETE VERSION WITH YOUR NAMING & TRIVY SCAN
# ===================================================================
default:
  tags:
    - docker
    
stages:
  - setup
  - build-and-push-to-nexus  # CORRECTED STAGE NAME
  - code-analysis
  - performance-test
  - push-and-scan-image      


# ===================================================================
# GLOBAL VARIABLES AND TEMPLATES
# ===================================================================
variables:
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache/"

# This scheduled job updates the Trivy DB cache. It remains unchanged.
update-trivy-db:
  stage: setup
  image: alpine:3.18
  cache:
    key: trivy-global-cache-v2
    paths:
      - .trivycache/
    policy: pull-push
  script:
    - echo "Updating Trivy database cache..."
    - apk add --no-cache wget ca-certificates # Added ca-certificates for safety
    - wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - mkdir -p "$TRIVY_CACHE_DIR"
    - trivy image --download-db-only --cache-dir "$TRIVY_CACHE_DIR" --timeout 30m
    - trivy image --download-java-db-only --cache-dir "$TRIVY_CACHE_DIR" --timeout 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ===================================================================
# SIMPLIFIED KANIKO + TRIVY TEMPLATE (Using Official Kaniko Image)
# ===================================================================
.kaniko_and_trivy_template: &kaniko_and_trivy_template
  stage: push-and-scan-image
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  cache:
    key:
      files:
        - .trivy-db.version
      prefix: trivy-v2
    paths:
      - .trivycache/
    policy: pull
  before_script:
    - echo "Installing dependencies..."
    - apk update
    - apk add curl ca-certificates # <<< THIS IS THE MOST IMPORTANT FIX FOR THE TLS ERROR
    - echo "Installing Trivy..."
    - curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.58.0/trivy_0.58.0_Linux-64bit.tar.gz -o trivy.tar.gz
    - tar -xzf trivy.tar.gz
    - mv trivy /usr/local/bin/
    - trivy --version
    - echo "Preparing Kaniko authentication..."
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n ${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - echo "Building image with Kaniko and saving as a tarball..."
    - /kaniko/executor --context "$BUILD_CONTEXT" --dockerfile "$BUILD_CONTEXT/Dockerfile" --destination "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" --tarPath image.tar --no-push
    - echo "Scanning the final container image for vulnerabilities..."
    - trivy image --input image.tar --exit-code 1 --severity CRITICAL,HIGH --cache-dir "$TRIVY_CACHE_DIR" --skip-db-update --skip-java-db-update --format template --template "@contrib/gitlab.tpl" -o gl-container-scanning-report.json
    - echo "Trivy scan passed. Pushing image to registry..."
    - /kaniko/executor --context "$BUILD_CONTEXT" --dockerfile "$BUILD_CONTEXT/Dockerfile" --destination "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" --destination "$IMAGE_NAME:latest"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 1 week

# ===================================================================
# JOBS FOR: user-management-service
# ===================================================================
build-and-push:user-service: # CORRECTED JOB NAME
  stage: build-and-push-to-nexus
  image: maven:3.8.5-openjdk-17
  script:
    - echo "--- STARTING DEBUG ---"
    - echo "1. Verifying environment variables..."
    - echo "'$NEXUS_URL'"
    - echo "'$NEXUS_USERNAME'"
    - echo "----------------------"
    - echo "2. Copying settings.xml from CI/CD variable..."
    - cp $SETTINGS_XML ./settings-temp.xml
    - echo "----------------------"
    - echo "3. Displaying the content of the settings-temp.xml BEFORE Maven uses it:"
    - cat ./settings-temp.xml
    - echo "--- ENDING DEBUG ---"
    - echo "Building, testing, and deploying user-management-service to Nexus..."
    - cd user-management-service
    - mvn clean deploy -s ../settings-temp.xml
  artifacts:
    paths:
      - user-management-service/target/
    reports:
      junit:
        - user-management-service/target/surefire-reports/TEST-*.xml
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

sonar-analysis:user-service:
  stage: code-analysis
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Preparing settings.xml for SonarQube analysis..."
    - cp $SETTINGS_XML ./settings-temp.xml
    - sed -i "s|NEXUS_URL_PLACEHOLDER|$NEXUS_URL|g" ./settings-temp.xml
    - sed -i "s|NEXUS_USERNAME_PLACEHOLDER|$NEXUS_USERNAME|g" ./settings-temp.xml
    - sed -i "s|NEXUS_PASSWORD_PLACEHOLDER|$NEXUS_PASSWORD|g" ./settings-temp.xml
    - echo "Running SonarQube analysis for user-management-service..."
    - cd user-management-service
    - >-
      mvn verify sonar:sonar -s ../settings-temp.xml
      -Dsonar.projectKey=com.tunisys:user-management-service
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  needs:
    - job: build-and-push:user-service # Depends on the newly named job
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

performance-test:user-service:
  stage: performance-test
  image: maven:3.8.5-openjdk-17
  needs: ["build-and-push:user-service"] # Depends on the newly named job
  script:
    - echo "Preparing to run Gatling tests for user-management-service..."
    - echo "Targeting application at:${STAGING_APP_URL}" 
    - cp $SETTINGS_XML ./settings-temp.xml
    - cd user-management-service
    - >-
      mvn gatling:test -s ../settings-temp.xml
      -Dgatling.simulationClass=company.user_management_service.simulations.UserManagementSimulation
      -DAPP_URL=${STAGING_APP_URL}
  artifacts:
    when: always
    paths:
      - user-management-service/target/gatling/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

push-and-scan:user-service:
  <<: *kaniko_and_trivy_template
  variables:
    IMAGE_NAME: "$DOCKERHUB_USERNAME/user-management-service"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/user-management-service"
  needs:
    - job: build-and-push:user-service
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

