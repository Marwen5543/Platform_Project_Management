# ===================================================================
# FIXED CI/CD PIPELINE WITH PROPER NEXUS CONFIGURATION
# ===================================================================

default:
  tags:
    - docker

stages:
  - build_and_publish_to_nexus
  - sonarqube_analysis
  - package_and_push_to_dockerhub

# Global cache for Maven dependencies
cache:
  key:
    files:
      - "*/pom.xml"
  paths:
    - .m2/repository/
  policy: pull-push

# ===================================================================
# JOB TEMPLATES
# ===================================================================

.nexus_build_template:
  stage: build_and_publish_to_nexus
  image: maven:3.8.5-openjdk-17
  services:
    - name: docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Create .m2 directory for Maven settings
    - mkdir -p ~/.m2
    # Copy and configure settings.xml with actual values
    - cp $SETTINGS_XML ./settings-temp.xml
    # Replace environment variable placeholders with actual values
    - sed -i "s|\${env.NEXUS_URL}|$NEXUS_URL|g" ./settings-temp.xml
    - sed -i "s|\${env.NEXUS_USERNAME}|$NEXUS_USERNAME|g" ./settings-temp.xml
    - sed -i "s|\${env.NEXUS_PASSWORD}|$NEXUS_PASSWORD|g" ./settings-temp.xml
    # Copy configured settings to Maven home
    - cp ./settings-temp.xml ~/.m2/settings.xml
    # Debug: Show the final settings (without passwords)
    - echo "=== Maven Settings Configuration ==="
    - cat ~/.m2/settings.xml | grep -v '<password>' | head -20
    - echo "=== End Settings ==="
    # Test network connectivity to Nexus
    - echo "=== Testing Nexus Connectivity ==="
    - curl -v --connect-timeout 10 $NEXUS_URL/repository/maven-public/ || echo "WARNING: Cannot reach Nexus repository"
  script:
    - echo "Building, testing, and deploying ${SERVICE_NAME} to Nexus..."
    - cd ${SERVICE_DIR}
    # Use the configured settings.xml
    - mvn clean deploy -s ~/.m2/settings.xml -X
  artifacts:
    paths:
      - ${SERVICE_DIR}/target/
    expire_in: 1 hour
    when: always

.sonarqube_analysis_template:
  stage: sonarqube_analysis
  image: maven:3.8.5-openjdk-17
  before_script:
    - mkdir -p ~/.m2
    - cp $SETTINGS_XML ./settings-temp.xml
    - sed -i "s|\${env.NEXUS_URL}|$NEXUS_URL|g" ./settings-temp.xml
    - sed -i "s|\${env.NEXUS_USERNAME}|$NEXUS_USERNAME|g" ./settings-temp.xml
    - sed -i "s|\${env.NEXUS_PASSWORD}|$NEXUS_PASSWORD|g" ./settings-temp.xml
    - cp ./settings-temp.xml ~/.m2/settings.xml
  script:
    - echo "Running SonarQube analysis for ${SERVICE_NAME}..."
    - cd ${SERVICE_DIR}
    - >-
      mvn verify sonar:sonar -s ~/.m2/settings.xml
      -Dsonar.projectKey=${SONAR_PROJECT_KEY}
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true

.dockerhub_push_template:
  stage: package_and_push_to_dockerhub
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "Packaging and pushing Docker image for ${SERVICE_NAME} to Docker Hub..."
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n ${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context ${CI_PROJECT_DIR}/${SERVICE_DIR}
      --dockerfile ${CI_PROJECT_DIR}/${SERVICE_DIR}/Dockerfile
      --destination ${DOCKERHUB_USERNAME}/${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
      --destination ${DOCKERHUB_USERNAME}/${DOCKER_IMAGE_NAME}:latest

# ===================================================================
# JOBS FOR: user-management-service
# ===================================================================
build:user-service:
  extends: .nexus_build_template
  variables:
    SERVICE_NAME: "user-management-service"
    SERVICE_DIR: "user-management-service"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

analyze:user-service:
  extends: .sonarqube_analysis_template
  needs: ["build:user-service"]
  variables:
    SERVICE_NAME: "user-management-service"
    SERVICE_DIR: "user-management-service"
    SONAR_PROJECT_KEY: "com.tunisys:user-management-service"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

package:user-service:
  extends: .dockerhub_push_template
  needs: ["build:user-service"]
  variables:
    SERVICE_NAME: "user-management-service"
    SERVICE_DIR: "user-management-service"
    DOCKER_IMAGE_NAME: "user-management-service"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

