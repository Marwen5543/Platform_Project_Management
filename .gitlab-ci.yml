# This pipeline has a dedicated 'test' stage for the user-service.
# It will NOT deploy to or touch the Kubernetes cluster.

stages:
  - build
  - test   # <-- ADDED a new stage here
  - push

# Reusable template for pushing to Docker Hub
.build_and_push_template:
  stage: push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building Docker image for $MICROSERVICE_NAME..."
    - docker build -t "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA" -f "$MICROSERVICE_PATH/Dockerfile" .
    - echo "Pushing new image version to Docker Hub..."
    - docker push "$DOCKERHUB_USERNAME/$MICROSERVICE_NAME:$CI_COMMIT_SHORT_SHA"

# ===================================================================
# JOBS FOR: user-management-service (REFACTORED)
# ===================================================================

# -- Job 1: Build (only compiles the code) --
build:user-service:
  stage: build
  image: maven:3.8.5-openjdk-17
  script:
    - echo "Compiling user-management-service..."
    - cd user-management-service
    # 'compile' is faster than 'package' as it doesn't run tests or create the jar yet
    - mvn clean compile
  artifacts:
    # We save the entire target folder to pass it to the next stage
    paths:
      - user-management-service/target/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*

# -- Job 2: Unit Tests (a new, visible job) --
unit-tests:user-service:
  stage: test # <-- This job runs in our new 'test' stage
  image: maven:3.8.5-openjdk-17
  needs: [build:user-service] # It depends on the 'build' job
  script:
    - echo "Running unit tests for user-management-service..."
    - cd user-management-service
    # The 'test' goal specifically runs the unit tests
    - mvn test
  artifacts:
    # This allows GitLab to parse and display test results in the UI
    reports:
      junit:
        - user-management-service/target/surefire-reports/TEST-*.xml

# -- Job 3: Push (now depends on the 'test' job) --
push:user-service:
  extends: .build_and_push_template
  variables:
    MICROSERVICE_NAME: user-management-service
    MICROSERVICE_PATH: user-management-service
  needs: [unit-tests:user-service] # It now waits for the 'unit-tests' job to pass
  script:
    # The script needs to package the app before building the Docker image
    - echo "Packaging user-management-service..."
    - cd user-management-service
    - mvn package -DskipTests # We skip tests here because they already ran
    - cd .. # Go back to the root directory for the Docker build
    # Now run the original script from the template
    - !reference [.build_and_push_template, script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - user-management-service/**/*


