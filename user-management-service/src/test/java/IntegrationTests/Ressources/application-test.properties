# Test Configuration - place this in src/test/resources/application-test.properties
spring.application.name=user-management-service-test

# Disable Keycloak provisioning for tests
keycloak.provisioning.enabled=false
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=test-realm
keycloak.resource=test-client
keycloak.credentials.secret=test-secret

# Disable Eureka for tests
eureka.client.enabled=false

# Security - disable for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/test-realm

# Logging
logging.level.root=WARN
logging.level.company.user_management_service=INFO

# Actuator for tests
management.endpoints.web.exposure.include=health,info