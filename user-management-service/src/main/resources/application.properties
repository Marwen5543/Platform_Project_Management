# Basic Service Configuration
spring.application.name=user-management-service
server.port=8085

# Keycloak Configuration (Local)
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=${KEYCLOAK_REALM:Tunisys}
keycloak.resource=${KEYCLOAK_RESOURCE:demo-rest-api}
keycloak.credentials.secret=${KEYCLOAK_CREDENTIALS_SECRET:6ZWEg9yWkbERGGJK0ju0AKaqgTn7S0wI}

# Logging
logging.level.org.keycloak=DEBUG
logging.level.org.springframework.security=DEBUG

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.hostname=localhost
eureka.instance.status-page-url=http://localhost:${server.port}/actuator/info
eureka.instance.health-check-url=http://localhost:${server.port}/actuator/health
eureka.instance.home-page-url=http://localhost:${server.port}/

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST

# Info Endpoint Configuration
info.app.name=${spring.application.name}
info.app.description=Department Management Service
info.app.version=1.0.0