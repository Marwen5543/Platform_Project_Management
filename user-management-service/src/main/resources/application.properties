# Basic Service Configuration
spring.application.name=user-management-service
server.port=8085

# Keycloak Configuration (Local)
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=${KEYCLOAK_REALM:Tunisys}
keycloak.resource=${KEYCLOAK_RESOURCE:demo-rest-api}
#keycloak.resource=demo-rest-api
keycloak.credentials.secret=${KEYCLOAK_CREDENTIALS_SECRET:g2XhOH0r047lVql0LLTGUmz8I6qUHNDp}
#keycloak.credentials.secret=J4pnUkiH2LnMV62smQPb2pCPYJ2yeTSy
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}
keycloak.provisioning.enabled=false
# Logging
logging.level.org.keycloak=DEBUG
logging.level.org.springframework.security=DEBUG

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.hostname=localhost
eureka.instance.status-page-url=http://localhost:${server.port}/actuator/info
eureka.instance.health-check-url=http://localhost:${server.port}/actuator/health
eureka.instance.home-page-url=http://localhost:${server.port}/

