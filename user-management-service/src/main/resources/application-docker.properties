# ===================================================================
#                      SERVICE CONFIGURATION
# ===================================================================
# Defines the application name and the port it will run on.
spring.application.name=user-management-service
server.port=8085

# ===================================================================
#                 EUREKA CLIENT CONFIGURATION
# This tells the service how to find the Eureka server.
# It reads the URL from the EUREKA_CLIENT_SERVICEURL_DEFAULTZONE environment
# variable provided by your Kubernetes deployment.
# ===================================================================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# ===================================================================
#           SPRING SECURITY / KEYCLOAK CONFIGURATION (MODERN)
# This is the standard Spring Boot 3 way to configure the resource server.
# It reads the Keycloak issuer URI from the environment variable set by Kubernetes.
# All legacy "keycloak.*" properties have been removed to avoid conflicts.
# ===================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/Tunisys}

# ===================================================================
#                  ACTUATOR CONFIGURATION
# THIS IS THE KEY FIX FOR PROMETHEUS & GRAFANA.
# It explicitly enables and exposes ONLY the 'health' and 'prometheus' endpoints.
# Exposing everything with "*" is a security risk.
# ===================================================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

# ===================================================================
#                  APPLICATION INFO
# ===================================================================
info.app.name=${spring.application.name}
info.app.description=User Management Service
info.app.version=1.0.0

